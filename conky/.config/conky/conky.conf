conky.config = {
    -- Window Settings
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#FFFFFF',
    default_outline_color = '#000000',
    default_shade_color = '#000000',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_shades = false,
    gap_x = 20,
    gap_y = 50,
    minimum_width = 330,
    minimum_height = 600,
    maximum_width = 330,
    
    -- Performance & System
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 180, -- Semi-transparent dark background
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.0,
    use_xft = true,
    font = 'Fira Sans:size=10',
    
    -- Dark Palette Colors
    color1 = '#1ADB96', -- Accent Neon Green (Data highlights)
    color2 = '#888888', -- Muted Gray (Labels)
    color3 = '#FF5555', -- Alert Red (High resource warning)
}

conky.text = [[
${color1}${font Fira Sans:bold:size=14}SYSTEM OVERVIEW ${hr 2}${font}

${color2}Host:${color} $nodename
${color2}OS:${color} KDE Neon (${machine})
${color2}Kernel:${color} $kernel
${color2}Uptime:${color} $uptime

${color1}${font Fira Sans:bold:size=11}CPU PROCESSOR ${hr 1}${font}
${color2}Frequency:${color} $freq_g GHz
${color2}Total Usage:${color} ${cpu cpu0}% ${color1}${cpubar cpu0 6}
${color2}Core 1:${color} ${cpu cpu1}% ${alignr}${color2}Core 2:${color} ${cpu cpu2}%
${color2}Core 3:${color} ${cpu cpu3}% ${alignr}${color2}Core 4:${color} ${cpu cpu4}%
${cpugraph 40,330 1ADB96 000000 -t}

${color1}${font Fira Sans:bold:size=11}MEMORY & STORAGE ${hr 1}${font}
${color2}RAM:${color} $mem / $memmax (${memperc}%)
${color1}${membar 6}
${color2}Swap:${color} $swap / $swapmax

${color2}Root FS:${color} ${fs_used /} / ${fs_size /} ${alignr}${fs_used_perc /}%
${color1}${fs_bar 6 /}

${color1}${font Fira Sans:bold:size=11}NETWORK TRAFFIC ${hr 1}${font}
${color2}Ethernet IP:${color} ${addr enp3s0}
${color2}Wi-Fi IP:   ${color} ${addr wlo1}

${color2}Wi-Fi Signal:${color} ${wireless_link_qual_perc wlo1}% ${color1}${wireless_link_bar 6 wlo1}

${color1}Wi-Fi Speed:${color}
${color2}Down:${color} ${downspeedf wl01} KiB/s ${alignr}${color2}Up:${color} ${upspeedf wlo1} KiB/s
${downspeedgraph wlo1 30,160 1ADB96 000000} ${alignr}${upspeedgraph wlo1 30,160 FF5555 000000}

${color1}Ethernet Speed:${color}
${color2}Down:${color} ${downspeedf enp3s0} KiB/s ${alignr}${color2}Up:${color} ${upspeedf enp3s0} KiB/s
${downspeedgraph enp3s0 30,160 1ADB96 000000} ${alignr}${upspeedgraph enp3s0 30,160 FF5555 000000}


${color1}${font Fira Sans:bold:size=11}TOP RATED PROCESSES ${hr 1}${font}
${color2}Name ${alignr}PID   CPU%   MEM%${color}
${top name 1} ${alignr}${top pid 1} ${top cpu 1} ${top mem 1}
${top name 2} ${alignr}${top pid 2} ${top cpu 2} ${top mem 2}
${top name 3} ${alignr}${top pid 3} ${top cpu 3} ${top mem 3}
${top name 4} ${alignr}${top pid 4} ${top cpu 4} ${top mem 4}
]]
